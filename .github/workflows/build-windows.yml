name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller PySide6
      - run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name ServoController
          --collect-all PySide6 --add-data "app/Main.qml;." app/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ServoController-windows
          path: dist/ServoController.exe
